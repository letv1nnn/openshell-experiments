version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /opt, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  github_api:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /repos/**
          - allow:
              method: POST
              path: /repos/*/*/pulls/*/reviews
          - allow:
              method: POST
              path: /repos/*/*/pulls/*/comments
    binaries:
      - { path: /usr/bin/gh }

  github_git:
    name: github-git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**/info/refs*
          - allow:
              method: POST
              path: /**/git-upload-pack
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/libexec/git-core/git-remote-https }

  opencode_telemetry:
    name: opencode-telemetry
    endpoints:
      - host: opencode.ai
        port: 443
        enforcement: audit
    binaries:
      - { path: /usr/local/bin/opencode }
