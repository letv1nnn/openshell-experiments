# Restrict gateway ingress to only authorized sources.
#
# Without this, any pod in the cluster can reach the unauthenticated
# gateway and invoke admin operations (create sandboxes, read provider
# credentials, etc.).
#
# This allows traffic from:
#   - Any pod in the openshell namespace (CronJob launchers, sandbox pods)
#   - The agent-sandbox controller (in agent-sandbox-system namespace)
# All other namespaces are blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshell-gateway-ingress
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: openshell
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell
  policyTypes:
    - Ingress
  ingress:
    # CronJob launcher pods and sandbox pods in this namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    # Agent-sandbox controller (creates and reconciles sandbox pods)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-sandbox-system
      ports:
        - protocol: TCP
          port: 8080
