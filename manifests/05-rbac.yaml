# Least-privilege RBAC for the CronJob service account.
#
# The openshell-sandbox SA only needs to read the two secrets injected
# as env vars and the ConfigMap mounted as the sandbox policy template.
# This limits blast radius if the SA token is compromised.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leadership-report-launcher
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: openshell
    app.kubernetes.io/component: leadership-report
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["google-credentials", "leadership-report-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["leadership-report-policy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leadership-report-launcher
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: openshell
    app.kubernetes.io/component: leadership-report
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leadership-report-launcher
subjects:
  - kind: ServiceAccount
    name: openshell-sandbox
    namespace: openshell
